[project]
name = "paper-atlas"
version = "0.1.0"
description = "Local research paper ingestion and hybrid retrieval powered by LangChain"
readme = "README.md"
authors = [
    { name = "Zanan Pech", email = "zananpech9@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.130.0",
    "fastmcp>=2.0.0",
    "langchain-chroma>=1.1.0",
    "langchain-docling>=3.0.0",
    "langchain-huggingface>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
paper-atlas = "paper_atlas:main"
paper-atlas-mcp = "paper_atlas.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
